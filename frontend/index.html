<!doctype html>
<html lang="zh-CN" data-appearance="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/brand/ca-logo-black.png" />
    <meta name="theme-color" content="#eef6fa" />
    <title>计算机协会本地管理系统</title>
    <style>
      #app > .app-boot {
        min-height: 100vh;
        display: grid;

        background: #f5f5f7;

        height: 72px;
        object-fit: contain;

    </div>
    <script type="module" src="/src/main.ts"></script>
