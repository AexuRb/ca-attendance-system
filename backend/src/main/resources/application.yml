server:
  address: 127.0.0.1
  port: ${APP_PORT:8080}

spring:
  application:
    name: attendance-backend
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 130MB

app:
  storage:
    root: ${APP_ROOT:.}
  auth:
    token-hours: 12
  remote:
    port: ${APP_REMOTE_PORT:8081}
  initial-admin:
    student-no: ${INITIAL_ADMIN_ACCOUNT:${INITIAL_ADMIN_STUDENT_NO:}}
    password: ${INITIAL_ADMIN_PASSWORD:}
  backup:
    retention:
      max-files: ${APP_BACKUP_MAX_FILES:50}
      max-total-bytes: ${APP_BACKUP_MAX_TOTAL_BYTES:5368709120}

logging:
  level:
    com.ca.attendance: INFO
